<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The framework's own icon, which the server already serves as an asset. -->
<link rel="icon" type="image/png" href="/asset/kotlinmcui%3Aicon.png">
<title>KotlinMCUI</title>
<style>
  /* The canvas is the whole surface; the status line sits on top of it and is never in the way.
     The background is not decoration: the canvas is transparent wherever a page has not painted, so
     this colour is what a user sees there. It is the one place the surface colour is written - the
     client reads it back and fills a capture with it - because `toBlob` exports the canvas alone and
     a page that is readable here would otherwise photograph as a blank one. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101014; }
  #screen { display: block; touch-action: none; outline: none; }
  #status {
    position: fixed; right: 6px; bottom: 4px;
    font: 11px/1.4 monospace; color: #7f7f8a; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="status">connecting</div>
<script src="/client.js"></script>
</body>
</html>
