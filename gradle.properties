org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

maven_group=io.github.u2894638479
archives_base_name=KotlinMCUI-web
license=MIT
mod_version=1.0.0-alpha.1
mod_id=kotlinmcuiweb
mod_name=KotlinMCUI-web
mod_description=Web backend for kotlinmcui
mod_authors=2894638479

# The core library is compiled on 21 and ships Java 8 bytecode, so the same split is kept here: the
# toolchain is what runs the build, the target is what runs the backend.
toolkit_version=21
java_version=1_8

kotlin_version=2.4.20

kotlinmcui_version=1.0.0-alpha.32

# Pinned to the floor the supported game versions ship, exactly as the core library pins them.
slf4j_version=2.0.1
fastutil_version=8.5.9
coroutines_version=1.11.0
serialization_version=1.11.0
